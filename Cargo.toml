[package]
name = "dolphy"
version = "0.1.0"
edition = "2021"
description = "A GTK4 file manager inspired by KDE Dolphin"
license = "GPL-3.0-or-later"
repository = "https://github.com/ArmanIOL/Dolphy"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
gio = "0.22"
glib = "0.22"
pango = "0.22"
